;==========================================================
;
;               PEAKYARCH POLYBAR
;
;==========================================================

[colors]
background      = #000000
background-alt  = #1a1a1a
foreground      = #d0d0d0
foreground-alt  = #ffffff
foreground-dim  = #606060
border          = #ffffff
selected        = #383838
alert           = #ffffff

[bar/peakyarch]
width           = 100%
height          = 36pt
radius          = 0

background      = ${colors.background}
foreground      = ${colors.foreground}

line-size       = 1pt
line-color      = ${colors.border}

border-top-size     = 0pt
border-bottom-size  = 2pt
border-top-color    = ${colors.border}
border-bottom-color = ${colors.border}

padding-left    = 0
padding-right   = 0

module-margin   = 0

separator           = ":"
seperator-font = xos4 Terminus:size=20;2
separator-foreground= ${colors.border}

font-0 = xos4 Terminus:size=16;2
font-1 = xos4 Terminus:size=16:weight=bold;2

modules-left  = decor-left xdecor-sep xwindow
modules-center = xworkspaces
modules-right = cpu decor-sep memory decor-sep battery decor-sep wlan decor-sep decor-sep pulseaudio decor-sep date decor-right

cursor-click  = pointer
enable-ipc    = true

wm-restack = bspwm

[module/decor-left]
type    = custom/text
content = "<%"
content-foreground = ${colors.border}

[module/decor-right]
type    = custom/text
content = "%>"
content-foreground = ${colors.border}

[module/decor-sep]
type    = custom/text
font    = seperator-font
content = ""
content-foreground = ${colors.border}

[module/xworkspaces]
type = internal/xworkspaces

label-active            = " a->%index%.wc:%nwin% "
label-active-foreground = ${colors.foreground-alt}
label-active-background = ${colors.selected}

label-occupied          = " o->%index%.wc:%nwin% "
label-occupied-foreground = ${colors.foreground}

label-urgent            = " u->%index%.wc:%nwin% "
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}

label-empty             = " e->%index%.wc:%nwin% "
label-empty-foreground  = ${colors.foreground-dim}

[module/xwindow]
type  = internal/xwindow
label = " %title:0:60:...% "
label-foreground = ${colors.foreground}

[module/cpu]
type            = internal/cpu
interval        = 2
format-prefix   = " CPU "
format-prefix-foreground = ${colors.border}
label           = "%percentage:2%% "

[module/memory]
type            = internal/memory
interval        = 2
format-prefix   = " RAM "
format-prefix-foreground = ${colors.border}
label           = "%percentage_used:2%% "

[module/battery]
type                                = internal/battery
battery                             = BAT1
adapter                             = AC
full-at                             = 100
interval                            = 5

format-charging-prefix              = " CHR "
format-charging-prefix-foreground   = ${colors.border}
format-charging                     = <label-charging>
label-charging                      = "%percentage%% "

format-discharging-prefix           = " BAT "
format-discharging-prefix-foreground= ${colors.border}
format-discharging                  = <label-discharging>
label-discharging                   = "%percentage%% "

format-full-prefix                  = " BAT "
format-full-prefix-foreground       = ${colors.border}
label-full                          = "FULL "

label-low                           = " LOW %percentage%% "
label-low-foreground                = ${colors.alert}
low-at                              = 20

[network-base]
type                = internal/network
interval            = 5
interface           = wlan0
format-connected    = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected  = " %ifname% down "
label-disconnected-foreground = ${colors.foreground-dim}

; Check device wlan0
[module/wlan]
inherit = network-base
interface = wlan0
interface-type = wireless
label-connected = " %ifname% %essid% "
label-connected-foreground = ${colors.foreground}

; [module/eth]
; inherit = network-base
; interface-type = wired
; label-connected = " %ifname% %local_ip% "
; label-connected-foreground = ${colors.foreground}

[module/pulseaudio]
type                            = internal/pulseaudio
format-volume-prefix            = " VOL "
format-volume-prefix-foreground = ${colors.border}
format-volume                   = <label-volume>
label-volume                    = "%percentage%% "
label-muted                     = " MTD "
label-muted-foreground          = ${colors.foreground-dim}

[module/date]
type        = internal/date
interval    = 1
date        = %H:%M
date-alt    = %Y-%m-%d %H:%M:%S
label       = " %date% "
label-foreground = ${colors.foreground-alt}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini